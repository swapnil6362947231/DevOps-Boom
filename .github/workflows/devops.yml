name: CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Code
        run: |
          echo "Code checkout successful"
          echo "Running code quality checks..."

  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy Application
        run: |
          echo "Deploying application..."
